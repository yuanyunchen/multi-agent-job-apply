# ---------------------------------------------------------------------------
# preferences.yaml — the ONE file you own.
#
# Copy this file to config/preferences.yaml and edit it, or let the setup
# conversation fill it in for you (`jobpilot start`).
#
# Everything here is about YOU: who you are on a form, which jobs count, what
# the assistant is allowed to do. None of it is logic — the code never hardcodes
# any of these values, and no path below points at a particular machine.
# ---------------------------------------------------------------------------

schema_version: 2

# Where the assistant keeps its own files (tracker, backups, logs, state).
# Supports ~ and $ENV_VARS. Can also be set with JOBPILOT_DATA_DIR.
paths:
  data_dir: "~/.jobpilot"

# How the assistant talks to you.
ui:
  mode: simple # simple = progress and outcomes only. technical = adds details.
  self_optimization_notice: one_line # none | one_line

# Who you are on application forms. Use your own values here.
identity:
  full_name: "{{FULL_NAME}}"
  apply_email: "{{APPLY_EMAIL}}" # the only address used on forms and accounts
  digest_email: "{{DIGEST_EMAIL}}" # where your daily summary goes
  never_use_emails: [] # addresses that must never reach a form
  phone: "{{PHONE}}"
  current_location: "{{CITY_STATE}}"
  linkedin_url: ""
  github_url: ""

# Your documents. Paths are relative to the repository root unless absolute.
documents:
  resume: "config/resumes/{{RESUME_FILE}}"
  answers: "config/answers.yaml" # the answer bank: see config/answers.example.yaml
  background_notes: "config/background.md" # facts a model may use in short essays

# Your own status only. Which posting sentences disqualify a role is logic
# (src/jobpilot/rules.py) and is the same for everyone.
work_authorization:
  authorized_to_work: true
  needs_sponsorship_now_or_later: true
  has_clearance: false
  # Sentence families that disqualify a posting, each requiring a verbatim quote
  # from the employer's own description:
  hard_exclude_on:
    no_sponsorship_at_all: true
    citizen_or_gc_only: true
    clearance_required: true
    itar_us_person: true
  # NOT a disqualifier: a posting that accepts OPT/CPT/STEM-OPT/EAD/an existing
  # visa but will not sponsor a new one. Those are normal roles.

timing:
  earliest_start_date: "{{YYYY-MM-DD}}"
  timezone: "America/New_York"

search:
  recency_days: 21
  max_required_years_experience: 2 # only an explicit "3+ years required" line drops a job
  seniority_excludes: ["Senior", "Staff", "Principal", "Lead", "Manager"]
  locations:
    countries: ["US"]
    remote_ok: true
    preferred: ["{{CITY_1}}", "{{CITY_2}}"]
  categories:
    # CORE is applied to first, newest first. NON_CORE waits until CORE is empty.
    core: ["Machine Learning Engineer", "AI Engineer", "Applied Scientist"]
    non_core: ["Software Engineer", "Backend Engineer", "Data Engineer"]
    excluded: ["Sales", "Product Manager", "Technician", "Hardware"]
  company_rules:
    hard_exclude: [] # never applied to, no quote needed
    hold_pending_user: [] # kept and tagged, never queued until you decide
  sources:
    # Built-in sources need no login and no account: they read public job-board
    # APIs. Add the board names (the part of the careers URL after the host).
    greenhouse:
      enabled: true
      boards: ["acme-robotics", "northwind-analytics"]
    lever:
      enabled: true
      boards: ["globex-systems"]
    ashby:
      enabled: false
      boards: []

apply:
  rows_per_wave: 20
  max_lanes: 2
  min_free_memory_mb: 1500
  projected_memory_per_lane_mb: 1200
  driver: dry_run # dry_run ships with the core; a real browser driver is a plugin
  never_reapply: true
  park_when_unanswerable: true # never invent an answer to a form question

# Nothing leaves this machine unless the matching permission is true AND the
# action passes the outbound gate. Defaults are all off.
permissions:
  submit_applications: false
  send_outreach_messages: false
  post_public_comments: false
  send_digest_email: false

# Receipt and verification-code reading. Read-only, any mail backend.
verify:
  receipt_window_minutes: 10
  mail_reader: none # none | json_export (a real mailbox connector is a plugin)
  mail_export_dir: "" # only used by json_export

# Which model answers which question. Providers are plugins (see below).
models:
  screen: claude-haiku
  review: claude-opus
  browser: claude-haiku
  providers:
    claude:
      enabled: true
      command: claude # the Claude Code CLI on your PATH
      models:
        claude-haiku: claude-haiku-4-5-20251001
        claude-sonnet: claude-sonnet-5
        claude-opus: claude-opus-4-8
    codex:
      enabled: false
      command: codex
    openai_compatible:
      enabled: false
      base_url: "https://api.example.com/v1"
      model: "some-model"
      api_key_env: "JOBPILOT_LLM_API_KEY" # the NAME of an env var, never the key
  fallback: [claude-haiku] # tried in order when the chosen role model is unhealthy

# Optional helpers. Anything that needs a login is off until you turn it on.
plugins:
  linkedin:
    enabled: false
    weekly_connect_cap: 90
    scope: ["connect", "comment"]
  handshake:
    enabled: false
    school_name: "{{SCHOOL_NAME}}"
  yc:
    enabled: false
    weekly_application_cap: 10

notifications:
  digest_time: "08:00" # when your daily summary is put together, on weekdays
  report_rejections: false
  immediate_alerts: ["interview_request", "online_assessment", "recruiter_reply"]
