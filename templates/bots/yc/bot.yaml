# Visibility and in-app applications on a startup jobs platform.
name: Startup Platform Bot
title: Startup Platform
description: >-
  Works a startup jobs platform where applying happens inside the platform
  itself: keeps the owner's profile visible to founders, applies in-app with a
  short note under a weekly cap, and handles replies. Everything it does is
  in-app - it sends no cold email and submits nothing on an employer's own
  site.

avatar:
  color: blue
  shape: teardrop

# Services this bot expects to be connected. Names only - never a token, a
# key or an account.
plugins:
  - browser
