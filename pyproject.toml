[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "2.0.0a1"
description = "A multi-agent job-application assistant: finds jobs, screens them with quoted evidence, applies through pluggable drivers, and reports in plain language."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/yuanyunchen/multi-agent-job-apply"
Source = "https://github.com/yuanyunchen/multi-agent-job-apply"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["jobpilot*"]

[tool.setuptools.package-data]
"jobpilot.plugins" = ["*/plugin.yaml", "*/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]
