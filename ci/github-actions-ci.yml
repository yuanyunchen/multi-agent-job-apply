name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        # The marker bolts every door to the real world: no network, no
        # mailbox, no browser, no model command line.
        env:
          JOBPILOT_TEST: "1"
        run: pytest -q

      - name: Self-check against the example settings
        env:
          JOBPILOT_CONFIG: config/preferences.example.yaml
          JOBPILOT_TEST: "1"
        run: jobpilot doctor

      - name: Sanitize scan
        run: python scripts/sanitize_scan.py

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone into a differently named folder, install, test
        run: scripts/migration_check.sh
